name: Sovereign Gate & Control Plane CI

on:
  push:
    branches: [ master, main, hermes-agentic-flow, "2-*" ]
  pull_request:
    branches: [ master, main, hermes-agentic-flow ]

jobs:
  verify-control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio langchain-core langchain-openai langgraph langgraph-checkpoint-sqlite

      - name: Bytecode Compilation Verification
        run: |
          python -m py_compile stress_test_sovereign.py tools/query_local_perplexity.py bin/perplexity_mcp_bridge.py agents/sovereign_gate.py utils.py config.py

      - name: Run Unit Test Suite
        run: |
          python -m pytest tests/tools/test_query_local_perplexity.py

      - name: Run Sovereign Adversarial Stress Harness
        run: |
          python stress_test_sovereign.py
